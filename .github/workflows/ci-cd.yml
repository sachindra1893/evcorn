# EVCorn Enterprise CI/CD Pipeline (Phase 3 — Release Engineering)

# Gates merges to main. Does NOT deploy to Vercel/Render (those remain auto-deploy).
# Live production checks are a separate workflow_dispatch job — never block PRs on Render cold starts.

name: EVCorn CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend install · lint · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Backend lint (syntax)
        run: npm run lint
        working-directory: backend

      - name: Backend tests + coverage
        run: npm run test:ci
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Write backend gate artifact
        run: |
          mkdir -p artifacts
          echo '{"pass":true,"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > artifacts/backend-test-results.json
          echo '{"pass":true,"note":"BE suites cover request-id, Server-Timing, Published status, search, retry","generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > artifacts/observability-results.json
          echo '{"pass":true,"note":"Regression suites in BE unit/integration","generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > artifacts/regression-results.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-gate-artifacts
          path: artifacts
          retention-days: 14

  frontend:
    name: Frontend install · test · build · size · SEO
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend unit tests + coverage
        run: npm run test:ci
        working-directory: frontend

      - name: Frontend production build
        run: npm run build
        working-directory: frontend

      - name: Bundle size gate
        run: node scripts/check-bundle-size.mjs

      - name: SEO static gate
        run: node scripts/seo-validate.mjs

      - name: Write frontend/build gate artifacts
        run: |
          mkdir -p artifacts
          echo '{"pass":true,"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > artifacts/frontend-test-results.json
          echo '{"pass":true,"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > artifacts/build-results.json

      - name: Upload build + gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-artifacts
          path: |
            frontend/dist
            artifacts
          retention-days: 14

  smoke:
    name: API smoke (file DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend (file DB)
        run: |
          MONGO_URI= NODE_ENV=development PORT=3000 node server.js &
          echo $! > /tmp/evcorn-be.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health/live >/dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          exit 1
        working-directory: backend

      - name: Smoke validation
        run: node scripts/smoke-validate.mjs

      - name: Stop backend
        if: always()
        run: kill $(cat /tmp/evcorn-be.pid) 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: artifacts
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root + app dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/playwright-report
            artifacts/playwright-results.json
            artifacts/playwright-output
          retention-days: 14

  security-audit:
    name: Dependency security audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Backend audit (high+)
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true
      - name: Frontend audit (high+)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

  release-report:
    name: Release report aggregator
    runs-on: ubuntu-latest
    needs: [backend, frontend, smoke, e2e]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download gate artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: false

      - name: Merge artifacts
        run: |
          mkdir -p artifacts
          find downloaded -type f -name '*.json' -exec cp -n {} artifacts/ \; || true
          # Prefer nested paths that match expected names
          for f in backend-test-results.json frontend-test-results.json build-results.json \
                   smoke-results.json perf-bundle-results.json seo-static-results.json \
                   observability-results.json regression-results.json playwright-results.json; do
            found=$(find downloaded -name "$f" | head -1 || true)
            if [ -n "$found" ]; then cp "$found" "artifacts/$f"; fi
          done
          ls -la artifacts || true

      - name: Generate release report
        run: node scripts/release-report.mjs
        continue-on-error: true

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          path: |
            artifacts/RELEASE_REPORT.md
            artifacts/RELEASE_REPORT.json
          retention-days: 30

      - name: Fail job if overall FAIL
        run: |
          if [ -f artifacts/RELEASE_REPORT.json ]; then
            node -e "const r=require('./artifacts/RELEASE_REPORT.json'); if(r.overall!=='PASS') process.exit(1)"
          else
            # Fallback: fail if any required upstream job failed
            echo "Missing release report — check upstream jobs"
            exit 1
          fi
