@if (isBackendWaking$ | async) {
  <div class="backend-waking-banner" role="status">
    Waking up the server… this can take up to a minute on the first request. Your content will appear automatically.
  </div>
}

<header>
  <app-navbar></app-navbar>
</header>

<main>
  <router-outlet (activate)="onActivate()"></router-outlet>
</main>

@if (isRouteReady) {
  <footer>
    <app-compare-tray></app-compare-tray>
    <app-footer></app-footer>
  </footer>
}
