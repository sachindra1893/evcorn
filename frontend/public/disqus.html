<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVCorn Comments</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
    }
    #disqus_thread {
      width: 100%;
      min-height: 200px;
    }
  </style>
</head>
<body>
  <div id="disqus_thread"></div>

  <script>
    // 1. Parse query parameters from the parent window URL
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id') || 'general';
    const articleTitle = urlParams.get('title') || 'EVCorn Discussion';

    // 2. Disqus Configuration
    var disqus_config = function () {
      this.page.url = 'https://evcorn.com/articles/' + articleId;
      this.page.identifier = articleId;
      this.page.title = articleTitle;
      this.page.developer = 1; // Force Disqus to load on localhost / local test environments
    };

    // 3. Load Disqus Script
    (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://evcorn.disqus.com/embed.js'; // Using EVCorn's unique Disqus shortname
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    })();

    // 4. Auto-Resizer: Notify the parent window about the height of the comments thread
    const notifyHeight = () => {
      const thread = document.getElementById('disqus_thread');
      if (!thread) return;
      const height = thread.offsetHeight || thread.scrollHeight;
      
      // Only notify if Disqus has actually rendered content (greater than 100px)
      if (height > 100) {
        window.parent.postMessage({
          type: 'resize-disqus',
          id: articleId,
          height: height + 20 // Add padding to prevent any edge clipping
        }, '*');
      }
    };

    // Listen for resize changes in Disqus container
    const resizeObserver = new ResizeObserver(() => {
      notifyHeight();
    });
    
    // Start observing Disqus container
    const thread = document.getElementById('disqus_thread');
    resizeObserver.observe(thread);

    // Initial check
    window.addEventListener('load', notifyHeight);
  </script>
</body>
</html>
