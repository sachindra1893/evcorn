<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVCorn Cloudinary Upload Test (Phase 2.3)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0F172A; color: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #1E293B; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 32px; width: 100%; max-width: 580px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #38BDF8; }
    p.subtitle { font-size: 0.88rem; color: #94A3B8; margin-bottom: 24px; }
    .dropzone { border: 2px dashed #475569; border-radius: 12px; padding: 24px; text-align: center; background: rgba(255,255,255,0.02); margin-bottom: 20px; transition: all 0.2s; }
    .dropzone:hover { border-color: #38BDF8; background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }
    .btn { background: linear-gradient(135deg, #0284C7, #0284C7); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 0.9rem; font-weight: 600; text-align: center; }
    .preview-box { margin-top: 24px; border-top: 1px solid #334155; padding-top: 20px; display: none; }
    .preview-box img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background: #0F172A; margin-bottom: 16px; border: 1px solid #334155; }
    pre { background: #090D16; color: #38BDF8; padding: 16px; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; border: 1px solid #1E293B; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ Cloudinary Upload Test</h1>
    <p class="subtitle">Phase 2.3 — Test POST /api/upload endpoint (multipart/form-data)</p>

    <div class="dropzone" id="dropzone">
      <span id="fileLabel">📁 Click to select an image file</span>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <button class="btn" id="uploadBtn" disabled>Upload to Cloudinary</button>
    <div class="status" id="statusMsg"></div>

    <div class="preview-box" id="previewBox">
      <h3 style="font-size: 1rem; color: #10B981; margin-bottom: 12px;">✓ Upload Successful</h3>
      <img id="resultImg" src="" alt="Uploaded Preview">
      <pre id="jsonResult"></pre>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');
    const previewBox = document.getElementById('previewBox');
    const resultImg = document.getElementById('resultImg');
    const jsonResult = document.getElementById('jsonResult');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        fileLabel.innerText = `Selected: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
        uploadBtn.disabled = false;
      }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      uploadBtn.disabled = true;
      statusMsg.style.color = '#38BDF8';
      statusMsg.innerText = 'Uploading to Cloudinary...';
      previewBox.style.display = 'none';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          statusMsg.style.color = '#10B981';
          statusMsg.innerText = '✓ Cloudinary Upload Successful!';
          resultImg.src = data.url;
          jsonResult.innerText = JSON.stringify(data, null, 2);
          previewBox.style.display = 'block';
        } else {
          statusMsg.style.color = '#EF4444';
          statusMsg.innerText = `Error: ${data.error || 'Upload failed'}`;
        }
      } catch (err) {
        statusMsg.style.color = '#EF4444';
        statusMsg.innerText = `Fetch Error: ${err.message}`;
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
